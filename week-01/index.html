<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect 4</title>
<meta name="description" content="Play Connect 4 against a strategic computer opponent.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #eef3ff;
    --bg-2: #fff0f5;
    --text: #1d2340;
    --muted: #5d6687;
    --card: rgba(255, 255, 255, 0.78);
    --card-border: #dfe5f5;
    --board: #2f5bea;
    --board-edge: #1f43c4;
    --hole: #eaf0ff;
    --hole-shadow: rgba(10, 25, 90, 0.35);
    --p1: #ff4d6d;
    --p1-light: #ff99ad;
    --p1-dark: #c92a4a;
    --p2: #ffc531;
    --p2-light: #ffe28a;
    --p2-dark: #d99a00;
    --accent: #2f5bea;
    --accent-text: #ffffff;
    --seg-bg: #e6ebfa;
    --win-bg: #e8fff1;
    --win-text: #11743d;
    --lose-bg: #fff1f3;
    --lose-text: #b1203f;
    --draw-bg: #f1f3fa;
    --draw-text: #3c4466;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #0e1226;
      --bg-2: #1b1030;
      --text: #eef1ff;
      --muted: #a3abcf;
      --card: rgba(27, 33, 64, 0.78);
      --card-border: #2c3462;
      --board: #3762f0;
      --board-edge: #2346c9;
      --hole: #121735;
      --hole-shadow: rgba(0, 0, 0, 0.6);
      --accent: #5b82ff;
      --seg-bg: #232a52;
      --win-bg: #12331f;
      --win-text: #7ef0a8;
      --lose-bg: #3a1420;
      --lose-text: #ff9db0;
      --draw-bg: #232a4a;
      --draw-text: #cdd3f2;
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #0e1226;
    --bg-2: #1b1030;
    --text: #eef1ff;
    --muted: #a3abcf;
    --card: rgba(27, 33, 64, 0.78);
    --card-border: #2c3462;
    --board: #3762f0;
    --board-edge: #2346c9;
    --hole: #121735;
    --hole-shadow: rgba(0, 0, 0, 0.6);
    --accent: #5b82ff;
    --seg-bg: #232a52;
    --win-bg: #12331f;
    --win-text: #7ef0a8;
    --lose-bg: #3a1420;
    --lose-text: #ff9db0;
    --draw-bg: #232a4a;
    --draw-text: #cdd3f2;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Fredoka", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--p1) 18%, transparent), transparent 40%),
      radial-gradient(circle at 88% 92%, color-mix(in srgb, var(--p2) 22%, transparent), transparent 42%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    background-color: var(--bg-1);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dots { display: inline-flex; gap: 4px; }
  .logo-dots span {
    width: 0.55em; height: 0.55em; border-radius: 50%;
    display: inline-block;
  }
  .logo-dots span:nth-child(odd) { background: var(--p1); }
  .logo-dots span:nth-child(even) { background: var(--p2); }
  .four {
    color: var(--accent);
  }
  .tagline { margin: 4px 0 0; color: var(--muted); font-weight: 500; }

  /* Scoreboard */
  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .score {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 10px 8px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .score .label {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 0.85rem; color: var(--muted); font-weight: 600;
  }
  .score .num {
    font-size: 1.7rem; font-weight: 700; line-height: 1.2;
    display: inline-block;
  }
  .score .num.bump { animation: bump 0.5s ease; }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.45); }
    100% { transform: scale(1); }
  }
  .chip {
    width: 12px; height: 12px; border-radius: 50%; display: inline-block;
    flex: none;
  }
  .chip.p1 { background: var(--p1); }
  .chip.p2 { background: var(--p2); }
  .chip.draw { background: linear-gradient(90deg, var(--p1) 50%, var(--p2) 50%); }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .segmented {
    display: inline-flex;
    background: var(--seg-bg);
    border-radius: 999px;
    padding: 4px;
    gap: 2px;
  }
  .segmented button {
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
  }
  .btn {
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    border: 0;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-text);
    box-shadow: 0 4px 0 var(--board-edge);
    transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--board-edge); }
  .btn svg { width: 18px; height: 18px; }
  button:focus-visible { outline: 3px solid var(--p2); outline-offset: 2px; }

  /* Status banner */
  .status {
    min-height: 58px;
    border-radius: 16px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 1.2rem;
    font-weight: 600;
    background: var(--card);
    border: 1px solid var(--card-border);
    text-align: center;
    flex-wrap: wrap;
    transition: background 0.3s, color 0.3s;
  }
  .status .chip { width: 18px; height: 18px; }
  .status.thinking .chip { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.7); opacity: 0.6; }
  }
  .status.result { font-size: 1.35rem; animation: pop 0.4s cubic-bezier(.2, 1.6, .4, 1); }
  .status.win { background: var(--win-bg); color: var(--win-text); border-color: transparent; }
  .status.lose { background: var(--lose-bg); color: var(--lose-text); border-color: transparent; }
  .status.draw { background: var(--draw-bg); color: var(--draw-text); border-color: transparent; }
  .status .btn { font-size: 0.95rem; padding: 8px 16px; }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Board */
  .stage { --gap: clamp(5px, 2vw, 12px); --pad: clamp(8px, 3vw, 18px); }
  .preview, .board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .preview {
    padding: 0 var(--pad);
    column-gap: var(--gap);
    margin-bottom: 6px;
  }
  .preview .slot { aspect-ratio: 1; position: relative; }
  .ghost {
    position: absolute; inset: 10%;
    border-radius: 50%;
    opacity: 0;
    transform: translateY(6px) scale(0.9);
    transition: opacity 0.15s, transform 0.15s;
  }
  .ghost.show { opacity: 0.9; transform: none; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .board {
    position: relative;
    gap: var(--gap);
    padding: var(--pad);
    background: linear-gradient(180deg, color-mix(in srgb, var(--board) 88%, white), var(--board));
    border-radius: 22px;
    box-shadow:
      0 10px 0 var(--board-edge),
      0 22px 40px rgba(20, 40, 120, 0.3),
      inset 0 2px 0 rgba(255, 255, 255, 0.25);
    touch-action: manipulation;
    user-select: none;
  }
  .cell {
    aspect-ratio: 1;
    position: relative;
    border-radius: 50%;
    cursor: pointer;
  }
  .cell::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: var(--hole);
    box-shadow: inset 0 4px 8px var(--hole-shadow);
    transition: background 0.15s;
  }
  .board.locked .cell { cursor: default; }
  .cell.col-hover::before {
    background: color-mix(in srgb, var(--hole) 82%, var(--p1));
  }
  .board.locked .cell.col-hover::before { background: var(--hole); }

  .disc {
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    z-index: 1;
    box-shadow:
      inset 0 -5px 0 rgba(0, 0, 0, 0.14),
      inset 0 0 0 5px rgba(255, 255, 255, 0.14),
      0 2px 4px rgba(0, 0, 0, 0.25);
    transition: opacity 0.3s, filter 0.3s;
  }
  .p1-fill { background: radial-gradient(circle at 35% 30%, var(--p1-light), var(--p1) 50%, var(--p1-dark)); }
  .p2-fill { background: radial-gradient(circle at 35% 30%, var(--p2-light), var(--p2) 50%, var(--p2-dark)); }
  .disc.drop { animation: drop var(--dur, 0.45s) cubic-bezier(.45, 0, .7, 1) both, settle 0.25s ease-out var(--dur, 0.45s); }
  @keyframes drop {
    from { transform: translateY(var(--fall)); }
    to { transform: translateY(0); }
  }
  @keyframes settle {
    0% { transform: translateY(0) scaleY(1); }
    35% { transform: translateY(-9%) scaleY(1.02); }
    70% { transform: translateY(0) scaleY(0.96); }
    100% { transform: translateY(0) scaleY(1); }
  }
  .board.finished .disc:not(.winner) { opacity: 0.35; filter: saturate(0.6); }
  .disc.winner { animation: glow 1s ease-in-out infinite; }
  .disc.winner::after {
    content: ""; position: absolute; inset: 30%;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.85);
  }
  @keyframes glow {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.0), inset 0 -5px 0 rgba(0,0,0,.14); }
    50% { transform: scale(1.08); box-shadow: 0 0 18px 4px rgba(255, 255, 255, 0.7), inset 0 -5px 0 rgba(0,0,0,.14); }
  }

  .hint { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 22px 0 0; }
  kbd {
    font-family: inherit; font-size: 0.8rem;
    background: var(--card); border: 1px solid var(--card-border);
    border-bottom-width: 2px; border-radius: 6px; padding: 0 6px;
  }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (max-width: 420px) {
    .controls { justify-content: center; }
    .segmented button { padding: 7px 11px; }
    .board { border-radius: 16px; }
    .disc { box-shadow: inset 0 -3px 0 rgba(0,0,0,.14), inset 0 0 0 3px rgba(255,255,255,.14), 0 1px 3px rgba(0,0,0,.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    .disc.drop { --dur: 0.01s; animation-duration: 0.01s; }
    .disc.winner, .ghost.show, .status.thinking .chip { animation: none; }
  }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<main class="wrap">
  <header>
    <h1>
      <span class="logo-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      Connect <span class="four">4</span>
    </h1>
    <p class="tagline">Line up four in a row before the computer does.</p>
  </header>

  <section class="scores" aria-label="Scoreboard">
    <div class="score">
      <div class="label"><span class="chip p1"></span>You</div>
      <div class="num" id="score-you">0</div>
    </div>
    <div class="score">
      <div class="label"><span class="chip draw"></span>Draws</div>
      <div class="num" id="score-draw">0</div>
    </div>
    <div class="score">
      <div class="label"><span class="chip p2"></span>Computer</div>
      <div class="num" id="score-cpu">0</div>
    </div>
  </section>

  <div class="controls">
    <div class="segmented" role="group" aria-label="Difficulty">
      <button type="button" data-level="easy" aria-pressed="false">Easy</button>
      <button type="button" data-level="medium" aria-pressed="true">Medium</button>
      <button type="button" data-level="hard" aria-pressed="false">Hard</button>
    </div>
    <button type="button" class="btn" id="restart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      Restart
    </button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="stage">
    <div class="preview" id="preview" aria-hidden="true"></div>
    <div class="board" id="board" role="grid" aria-label="Connect 4 board, 7 columns by 6 rows"></div>
    <p class="hint">Click a column to drop a disc. Keyboard: <kbd>←</kbd> <kbd>→</kbd> then <kbd>Enter</kbd>, or <kbd>1</kbd>–<kbd>7</kbd>. <kbd>R</kbd> restarts.</p>
  </section>
</main>

<script>
(() => {
  const ROWS = 6, COLS = 7;
  const EMPTY = 0, HUMAN = 1, AI = 2;
  const CENTER_ORDER = [3, 2, 4, 1, 5, 0, 6];
  const WIN_SCORE = 1000000;
  const COLUMN_WEIGHT = [0, 1, 2, 3, 2, 1, 0];
  // Search depth (in plies) per level. Easy also blunders sometimes.
  const LEVELS = {
    easy:   { depth: 2, blunder: 0.3 },
    medium: { depth: 4, blunder: 0 },
    hard:   { depth: 7, blunder: 0 },
  };

  const boardEl = document.getElementById('board');
  const previewEl = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const scoreEls = {
    you: document.getElementById('score-you'),
    cpu: document.getElementById('score-cpu'),
    draw: document.getElementById('score-draw'),
  };

  let board, cells, ghosts, moves;
  let state = 'human';           // 'human' | 'ai' | 'over'
  let hoverCol = 3;
  let level = 'medium';
  let humanStarts = true;
  let gameToken = 0;              // invalidates pending AI timers on restart
  let score = loadScore();

  /* ---------- Persistence (best effort) ---------- */
  function loadScore() {
    try {
      const s = JSON.parse(localStorage.getItem('c4-score'));
      if (s && typeof s.you === 'number') return s;
    } catch (e) {}
    return { you: 0, cpu: 0, draw: 0 };
  }
  function saveScore() {
    try { localStorage.setItem('c4-score', JSON.stringify(score)); } catch (e) {}
  }
  try {
    const saved = localStorage.getItem('c4-level');
    if (saved && LEVELS[saved]) level = saved;
  } catch (e) {}

  /* ---------- Board helpers (shared by UI and AI) ---------- */
  const emptyBoard = () => Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
  function dropRow(b, c) {
    for (let r = ROWS - 1; r >= 0; r--) if (b[r][c] === EMPTY) return r;
    return -1;
  }
  const validCols = b => CENTER_ORDER.filter(c => b[0][c] === EMPTY);

  // Returns the cells of a 4+ line through (r, c) for player p, or null.
  function winLine(b, r, c, p) {
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (const [dr, dc] of dirs) {
      const line = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b[rr][cc] === p) {
          line.push([rr, cc]);
          rr += dr * s; cc += dc * s;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  /* ---------- AI: minimax with alpha-beta pruning ---------- */
  const WINDOWS = [];
  (function buildWindows() {
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        for (const [dr, dc] of dirs) {
          const er = r + dr * 3, ec = c + dc * 3;
          if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
          WINDOWS.push([0, 1, 2, 3].map(i => [r + dr * i, c + dc * i]));
        }
  })();

  // Static evaluation from the AI's point of view.
  function evaluate(b) {
    let s = 0;
    // Central columns take part in more possible lines.
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const w = COLUMN_WEIGHT[c];
        if (b[r][c] === AI) s += w; else if (b[r][c] === HUMAN) s -= w;
      }
    for (const w of WINDOWS) {
      let ai = 0, hu = 0;
      for (const [r, c] of w) {
        const v = b[r][c];
        if (v === AI) ai++; else if (v === HUMAN) hu++;
      }
      if (ai && hu) continue;
      if (ai === 3) s += 6;
      else if (ai === 2) s += 2;
      else if (hu === 3) s -= 8;   // weigh opponent threats a little higher
      else if (hu === 2) s -= 2;
    }
    return s;
  }

  function search(b, depth, alpha, beta, maximizing) {
    const cols = validCols(b);
    if (!cols.length) return 0;
    if (depth === 0) return evaluate(b);
    const me = maximizing ? AI : HUMAN;
    let best = maximizing ? -Infinity : Infinity;
    for (const c of cols) {
      const r = dropRow(b, c);
      b[r][c] = me;
      let v;
      if (winLine(b, r, c, me)) v = maximizing ? WIN_SCORE + depth : -WIN_SCORE - depth;
      else v = search(b, depth - 1, alpha, beta, !maximizing);
      b[r][c] = EMPTY;
      if (maximizing) { if (v > best) best = v; if (best > alpha) alpha = best; }
      else { if (v < best) best = v; if (best < beta) beta = best; }
      if (alpha >= beta) break;
    }
    return best;
  }

  function chooseMove() {
    const { depth, blunder } = LEVELS[level];
    const b = board.map(row => row.slice());
    const cols = validCols(b);

    // Always take an immediate win.
    for (const c of cols) {
      const r = dropRow(b, c);
      b[r][c] = AI;
      const won = winLine(b, r, c, AI);
      b[r][c] = EMPTY;
      if (won) return c;
    }
    // Easy mode occasionally plays a casual (random) move.
    if (Math.random() < blunder) return cols[Math.floor(Math.random() * cols.length)];

    let best = -Infinity, bestCols = [];
    for (const c of cols) {
      const r = dropRow(b, c);
      b[r][c] = AI;
      const v = search(b, depth - 1, -Infinity, Infinity, false);
      b[r][c] = EMPTY;
      if (v > best) { best = v; bestCols = [c]; }
      else if (v === best) bestCols.push(c);
    }
    return bestCols[Math.floor(Math.random() * bestCols.length)];
  }

  /* ---------- UI ---------- */
  function buildDom() {
    boardEl.innerHTML = '';
    previewEl.innerHTML = '';
    cells = [];
    ghosts = [];
    for (let c = 0; c < COLS; c++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      const g = document.createElement('div');
      g.className = 'ghost p1-fill';
      slot.appendChild(g);
      previewEl.appendChild(slot);
      ghosts.push(g);
    }
    for (let r = 0; r < ROWS; r++) {
      cells.push([]);
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', `Column ${c + 1}, row ${ROWS - r}, empty`);
        boardEl.appendChild(cell);
        cells[r].push(cell);
      }
    }
  }

  function renderScores(bumpKey) {
    for (const k of Object.keys(scoreEls)) scoreEls[k].textContent = score[k];
    if (bumpKey) {
      const el = scoreEls[bumpKey];
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
  }

  function setStatus(html, cls = '') {
    statusEl.className = 'status ' + cls;
    statusEl.innerHTML = html;
  }

  function renderHover() {
    const active = state === 'human';
    boardEl.classList.toggle('locked', !active);
    ghosts.forEach((g, c) => g.classList.toggle('show', active && c === hoverCol && board[0][c] === EMPTY));
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        cells[r][c].classList.toggle('col-hover', active && c === hoverCol);
  }

  function newGame() {
    gameToken++;
    board = emptyBoard();
    moves = 0;
    buildDom();
    boardEl.classList.remove('finished');
    stopConfetti();
    if (humanStarts) {
      state = 'human';
      setStatus('<span class="chip p1"></span>Your move — you\'re red');
    } else {
      state = 'ai';
      setStatus('<span class="chip p2"></span>Computer goes first this round…', 'thinking');
      scheduleAi(600);
    }
    renderHover();
  }

  function placeDisc(c, player) {
    const r = dropRow(board, c);
    if (r < 0) return null;
    board[r][c] = player;
    moves++;
    const disc = document.createElement('div');
    disc.className = 'disc drop ' + (player === HUMAN ? 'p1-fill' : 'p2-fill');
    // Start the disc just above the board, in the preview row.
    const cell = cells[r][c];
    disc.style.setProperty('--fall', -(cell.offsetTop + cell.offsetHeight * 1.15) + 'px');
    disc.style.setProperty('--dur', (0.22 + r * 0.05).toFixed(2) + 's');
    cells[r][c].appendChild(disc);
    cells[r][c].dataset.p = player;
    cells[r][c].setAttribute('aria-label',
      `Column ${c + 1}, row ${ROWS - r}, ${player === HUMAN ? 'your disc' : 'computer disc'}`);
    return r;
  }

  function afterMove(r, c, player) {
    const line = winLine(board, r, c, player);
    if (line) return endGame(player, line);
    if (moves === ROWS * COLS) return endGame(EMPTY, null);
    if (player === HUMAN) {
      state = 'ai';
      setStatus('<span class="chip p2"></span>Computer is thinking…', 'thinking');
      scheduleAi(520);
    } else {
      state = 'human';
      setStatus('<span class="chip p1"></span>Your move');
    }
    renderHover();
  }

  function humanPlay(c) {
    if (state !== 'human' || board[0][c] !== EMPTY) return;
    const r = placeDisc(c, HUMAN);
    state = 'ai';               // lock input immediately
    afterMove(r, c, HUMAN);
  }

  function scheduleAi(delay) {
    const token = gameToken;
    setTimeout(() => {
      if (token !== gameToken || state !== 'ai') return;
      const c = chooseMove();
      const r = placeDisc(c, AI);
      afterMove(r, c, AI);
    }, delay);
  }

  function endGame(winner, line) {
    state = 'over';
    renderHover();
    const token = gameToken;
    humanStarts = !humanStarts;      // alternate who starts next round
    let key, html, cls;
    if (winner === HUMAN) {
      key = 'you'; cls = 'result win';
      html = '🎉 You win! Nicely played.';
    } else if (winner === AI) {
      key = 'cpu'; cls = 'result lose';
      html = '🤖 The computer wins this one.';
    } else {
      key = 'draw'; cls = 'result draw';
      html = '🤝 It\'s a draw — the board is full.';
    }
    score[key]++;
    saveScore();
    document.body.dataset.result = key;
    // Let the last disc land before celebrating.
    setTimeout(() => {
      if (token !== gameToken) return;
      if (line) {
        boardEl.classList.add('finished');
        for (const [r, c] of line) cells[r][c].querySelector('.disc').classList.add('winner');
      }
      renderScores(key);
      setStatus(`<span>${html}</span><button type="button" class="btn" id="again">Play again</button>`, cls);
      document.getElementById('again').addEventListener('click', newGame);
      if (winner === HUMAN) startConfetti();
    }, 550);
  }

  /* ---------- Input ---------- */
  boardEl.addEventListener('click', e => {
    const cell = e.target.closest('.cell');
    if (cell) humanPlay(+cell.dataset.c);
  });
  boardEl.addEventListener('mousemove', e => {
    const cell = e.target.closest('.cell');
    if (cell && +cell.dataset.c !== hoverCol) { hoverCol = +cell.dataset.c; renderHover(); }
  });
  previewEl.addEventListener('click', e => {
    const slot = e.target.closest('.slot');
    if (slot) humanPlay([...previewEl.children].indexOf(slot));
  });

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (k === 'r' || k === 'R') { newGame(); return; }
    if (state !== 'human') return;
    if (k === 'ArrowLeft') { hoverCol = (hoverCol + COLS - 1) % COLS; renderHover(); e.preventDefault(); }
    else if (k === 'ArrowRight') { hoverCol = (hoverCol + 1) % COLS; renderHover(); e.preventDefault(); }
    else if ((k === 'Enter' || k === ' ' || k === 'ArrowDown') && !e.target.closest('button')) { humanPlay(hoverCol); e.preventDefault(); }
    else if (/^[1-7]$/.test(k)) { hoverCol = +k - 1; humanPlay(hoverCol); }
  });

  document.getElementById('restart').addEventListener('click', newGame);

  const levelButtons = document.querySelectorAll('.segmented button');
  function renderLevel() {
    levelButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === level)));
  }
  levelButtons.forEach(btn => btn.addEventListener('click', () => {
    level = btn.dataset.level;
    try { localStorage.setItem('c4-level', level); } catch (e) {}
    renderLevel();
  }));

  /* ---------- Confetti ---------- */
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let confetti = [], confettiFrame = null;
  function startConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#ff4d6d', '#ffc531', '#2f5bea', '#2ec27e', '#a66cff'];
    confetti = Array.from({ length: 160 }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: innerHeight * 0.35,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 13 - 4,
      size: 6 + Math.random() * 6,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 0,
    }));
    cancelAnimationFrame(confettiFrame);
    const tick = () => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      confetti = confetti.filter(p => p.life < 180 && p.y < innerHeight + 30);
      for (const p of confetti) {
        p.life++;
        p.vy += 0.28; p.vx *= 0.99;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / 180);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      }
      confettiFrame = confetti.length ? requestAnimationFrame(tick) : null;
    };
    tick();
  }
  function stopConfetti() {
    cancelAnimationFrame(confettiFrame);
    confetti = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Hooks for automated testing.
  window.__connect4 = {
    get state() { return state; },
    get board() { return board.map(r => r.slice()); },
    chooseMoveFor(b, lvl) { const saved = [board, level]; board = b; level = lvl; try { return chooseMove(); } finally { [board, level] = saved; } },
  };

  renderLevel();
  renderScores();
  newGame();
})();
</script>
</body>
</html>
